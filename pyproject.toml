[project]
name = "zilant-encrypt"
version = "0.1.0"
description = "Password-only container encryption utility"
authors = [{name = "WeekCrew"}]
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
    "click>=8.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S311"]

[tool.isort]
profile = "black"
known_first_party = ["zilant_encrypt"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
